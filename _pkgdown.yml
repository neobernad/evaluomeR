url: https://neobernad.github.io/evaluomeR/

template:
  bootstrap: 5
  # Light theme matching the demo app (cobalt + gold). Most styling lives in pkgdown/extra.css.
  bslib:
    primary: "#1D3FBF"
    secondary: "#4A5580"
    bg: "#F7F8FF"
    fg: "#0B1640"
    link-color: "#1D3FBF"
    code_font: {google: "JetBrains Mono"}
  includes:
    in_header: |
      <link rel="icon" type="image/svg+xml" href="https://neobernad.github.io/evaluomeR/logo.svg">

home:
  title: "evaluomeR — Evaluate Bioinformatics Metrics"
  description: >
    Bootstrap Jaccard stability, silhouette quality, and optimal-k selection
    for bioinformatics metric datasets. Includes an interactive NCI-60 cancer
    cell-line demo. Bioconductor R package.
  links:
  - text: "Try the interactive demo"
    href: app/index.html
  - text: "Bioconductor page"
    href: https://bioconductor.org/packages/evaluomeR

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [demo, github]
  components:
    demo:
      text: "Try Demo"
      href: app/index.html
      icon: fa-play-circle

articles:
  - title: "Get started"
    contents: [manual]
  - title: "Publications"
    contents: [publications]

development:
  mode: auto
